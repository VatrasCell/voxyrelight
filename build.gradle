plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.19'
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

// Voxy is resolved from Modrinth Maven. Pass -Pvoxy_jar=<path> to build against a local JAR instead.
def voxy = project.hasProperty('voxy_jar') ? files(project.voxy_jar) : "maven.modrinth:voxy:${project.voxy_version}"

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Voxy is only needed for compiling; it is neither bundled nor redistributed.
    // MC 26.2 is unobfuscated, so compileOnly is enough (no modCompileOnly/remapping needed).
    compileOnly voxy

    testImplementation voxy
    testImplementation platform("org.junit:junit-bom:5.13.4")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
    it.options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
